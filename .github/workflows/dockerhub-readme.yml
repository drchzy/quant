name: Sync Docker Hub README

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/dockerhub/quant.md"
      - ".github/workflows/dockerhub-readme.yml"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成 Docker Hub README
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed "s/__DOCKERHUB_USERNAME__/${DOCKERHUB_USERNAME}/g" \
            docs/dockerhub/quant.md \
            > /tmp/quant-dockerhub-readme.md

      - name: 更新 Quant README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/quant
          short-description: A股本地行情、选股、回测、持仓与盘中执行 All-in-One 平台
          readme-filepath: /tmp/quant-dockerhub-readme.md
