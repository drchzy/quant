name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 market-data 标签
        id: market_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-market-data
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 market-data
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/market-data/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.market_meta.outputs.tags }}
          labels: ${{ steps.market_meta.outputs.labels }}

      - name: 生成 stock-select 标签
        id: select_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-stock-select
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 stock-select
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/stock-select/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.select_meta.outputs.tags }}
          labels: ${{ steps.select_meta.outputs.labels }}

      - name: 生成 trade-manager 标签
        id: trade_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-trade-manager
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 trade-manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/trade-manager/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.trade_meta.outputs.tags }}
          labels: ${{ steps.trade_meta.outputs.labels }}

      - name: 生成 Web 标签
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-web
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}

      - name: 更新 market-data Docker Hub 中文说明
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/quant-market-data
          short-description: "Quant A股行情采集、DuckDB持久化与统一行情API"
          readme-filepath: ./docker/README-market-data.md

      - name: 更新 stock-select Docker Hub 中文说明
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/quant-stock-select
          short-description: "Quant A股超短趋势选股、复盘与参数回测"
          readme-filepath: ./docker/README-stock-select.md

      - name: 更新 trade-manager Docker Hub 中文说明
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/quant-trade-manager
          short-description: "Quant 持仓、盘中执行状态、T+1与止盈止损监控"
          readme-filepath: ./docker/README-trade-manager.md

      - name: 更新 Web Docker Hub 中文说明
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/quant-web
          short-description: "Quant A股行情、选股、盘中执行与策略复盘Web界面"
          readme-filepath: ./docker/README-web.md
