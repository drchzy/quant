name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成 market-data 标签
        id: market_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-market-data
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 market-data
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/market-data/Dockerfile
          push: true
          tags: ${{ steps.market_meta.outputs.tags }}
          labels: ${{ steps.market_meta.outputs.labels }}

      - name: 生成 stock-select 标签
        id: select_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-stock-select
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 stock-select
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/stock-select/Dockerfile
          push: true
          tags: ${{ steps.select_meta.outputs.tags }}
          labels: ${{ steps.select_meta.outputs.labels }}

      - name: 生成 Web 标签
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/quant-web
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: 发布 Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
