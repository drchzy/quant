name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 编译全部服务和页面
        run: npm run build

      - name: 启动 market-data
        shell: bash
        run: |
          mkdir -p data
          SYNC_ENABLED=false DATABASE_PATH="$PWD/data/ci-market.duckdb" node services/market-data/dist/server.js > /tmp/market-data.log 2>&1 &
          echo $! > /tmp/market-data.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              curl -fsS "http://127.0.0.1:8080/api/v1/market/technical?days=30"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/market-data.log
          exit 1

      - name: 启动 stock-select
        shell: bash
        run: |
          AUTO_SELECT_ENABLED=false           SELECT_DATABASE_PATH="$PWD/data/ci-select.duckdb"           MARKET_DATA_URL="http://127.0.0.1:8080"           node services/stock-select/dist/server.js > /tmp/stock-select.log 2>&1 &
          echo $! > /tmp/stock-select.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8090/health; then
              curl -fsS http://127.0.0.1:8090/api/v1/select/config
              curl -fsS "http://127.0.0.1:8090/api/v1/select/review/summary?mainOnly=true"
              curl -fsS http://127.0.0.1:8090/api/v1/select/backtests/latest
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stock-select.log
          exit 1

      - name: 启动 trade-manager
        shell: bash
        run: |
          TRADE_MONITOR_ENABLED=false \
          TRADE_DATABASE_PATH="$PWD/data/ci-trade.duckdb" \
          MARKET_DATA_URL="http://127.0.0.1:8080" \
          STOCK_SELECT_URL="http://127.0.0.1:8090" \
          node services/trade-manager/dist/server.js > /tmp/trade-manager.log 2>&1 &
          echo $! > /tmp/trade-manager.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8091/health; then
              curl -fsS http://127.0.0.1:8091/api/v1/trading/today
              curl -fsS http://127.0.0.1:8091/api/v1/trading/events?limit=5
              exit 0
            fi
            sleep 1
          done
          cat /tmp/trade-manager.log
          exit 1

      - name: 检查 Docker Compose
        run: docker compose --env-file web/config/.env.example config

      - name: 构建 market-data 镜像
        run: docker build -f services/market-data/Dockerfile -t quant-market-data:test .

      - name: 构建 stock-select 镜像
        run: docker build -f services/stock-select/Dockerfile -t quant-stock-select:test .

      - name: 构建 trade-manager 镜像
        run: docker build -f services/trade-manager/Dockerfile -t quant-trade-manager:test .

      - name: 构建 Web 镜像
        run: docker build -f apps/web/Dockerfile -t quant-web:test .

      - name: 检查 Web 默认登录脚本
        shell: bash
        run: |
          docker run --rm \
            -e WEB_AUTH_ENABLED=true \
            -e WEB_USERNAME=admin \
            -e WEB_PASSWORD=quant123456 \
            --entrypoint sh \
            quant-web:test \
            -c '/docker-entrypoint.d/40-basic-auth.sh && test -s /etc/nginx/.htpasswd && grep -q admin /etc/nginx/.htpasswd'

      - name: 停止测试服务
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/trade-manager.pid ]; then kill "$(cat /tmp/trade-manager.pid)" || true; fi
          if [ -f /tmp/stock-select.pid ]; then kill "$(cat /tmp/stock-select.pid)" || true; fi
          if [ -f /tmp/market-data.pid ]; then kill "$(cat /tmp/market-data.pid)" || true; fi
