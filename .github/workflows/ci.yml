name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 编译后端和前端
        run: npm run build

      - name: 启动后端并检查健康状态
        shell: bash
        run: |
          mkdir -p data
          SYNC_ENABLED=false DATABASE_PATH="$PWD/data/ci.duckdb" node services/market-data/dist/server.js > /tmp/market-data.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/market-data.log
          exit 1

      - name: 检查 Docker Compose
        run: docker compose config

      - name: 构建 market-data 镜像
        run: docker build -f services/market-data/Dockerfile -t quant-market-data:test .

      - name: 构建 Web 镜像
        run: docker build -f apps/web/Dockerfile -t quant-web:test .
