name: CI

on:
  workflow_dispatch:

  # 只有会影响程序运行或镜像内容的文件变化，才执行完整构建。
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "services/**"
      - "apps/**"
      - "docker/**"
      - "web/docker-compose.yml"
      - "web/.env"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "services/**"
      - "apps/**"
      - "docker/**"
      - "web/docker-compose.yml"
      - "web/.env"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      - name: 编译全部模块和页面
        run: npm run build

      - name: 测试行情 Provider 解析与能力
        run: node --test services/market-data/test/*.test.mjs

      - name: 检查单容器 Compose
        run: |
          docker compose config
          docker compose -f web/docker-compose.yml config

      - name: 构建 All-in-One 镜像
        run: docker build -t quant:test .

      - name: 准备 CI 运行目录
        shell: bash
        run: |
          mkdir -p ci-web/data
          cp web/.env ci-web/.env
          sed -i 's/SYNC_ENABLED="true"/SYNC_ENABLED="false"/' ci-web/.env
          sed -i 's/AUTO_SELECT_ENABLED="true"/AUTO_SELECT_ENABLED="false"/' ci-web/.env
          sed -i 's/TRADE_MONITOR_ENABLED="true"/TRADE_MONITOR_ENABLED="false"/' ci-web/.env

      - name: 启动 All-in-One 容器
        run: |
          docker run -d \
            --name quant-ci \
            -p 18088:8088 \
            -v "$PWD/ci-web:/app/web" \
            quant:test

      - name: 验证统一端口
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18088/health; then
              curl -fsS http://127.0.0.1:18088/
              curl -fsS http://127.0.0.1:18088/api/v1/select/config
              curl -fsS http://127.0.0.1:18088/api/v1/trading/today
              test -f ci-web/data/market.duckdb
              test -f ci-web/data/select.duckdb
              test -f ci-web/data/trade.duckdb
              exit 0
            fi
            sleep 2
          done
          docker logs quant-ci
          exit 1

      - name: 输出容器日志
        if: failure()
        run: docker logs quant-ci || true

      - name: 停止测试容器
        if: always()
        run: docker rm -f quant-ci || true
