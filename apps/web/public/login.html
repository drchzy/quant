<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>登录 · Quant 行情平台</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080f1f;color:#e2e8f0;display:grid;place-items:center;padding:20px;overflow:hidden}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 30% 30%,#1e40af65,transparent 34%),radial-gradient(circle at 75% 60%,#0f766e55,transparent 30%);pointer-events:none}
main{position:relative;width:min(100%,430px);padding:40px;background:#0d172be8;border:1px solid #334155;border-radius:22px;box-shadow:0 40px 100px #0008}
.logo{display:flex;gap:10px;align-items:center;font-size:23px;font-weight:800;letter-spacing:.3px}.logo em{font-style:normal;background:#2463ef;padding:7px 12px;border-radius:11px}
.tag{font-size:11px;font-weight:500;color:#94a3b8;letter-spacing:2px;margin-top:16px}h1{font-size:24px;margin:36px 0 8px}p{color:#94a3b8;line-height:1.6;font-size:13px;margin:0 0 29px}
label{font-size:13px;color:#cbd5e1;display:block;margin:0 0 8px}input{width:100%;height:46px;color:#f8fafc;background:#111f35;border:1px solid #36455f;border-radius:10px;padding:0 14px;outline:none;margin-bottom:20px;font-size:15px}input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #1d4ed83a}
button{width:100%;height:48px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:15px;font-weight:650;cursor:pointer;transition:background .2s}button:hover{background:#1d4ed8}button:disabled{opacity:.55;cursor:wait}
.err{min-height:36px;color:#fda4af;font-size:13px;margin-top:13px;line-height:1.5}
footer{margin-top:22px;color:#64748b;text-align:center;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="logo"><em>Q</em> Quant <span style="font-size:12px;color:#94a3b8;font-weight:400">行情与交易研究平台</span></div>
  <div class="tag">PRIVATE RESEARCH TERMINAL</div>
  <h1>欢迎回来</h1>
  <p>输入配置在服务器 <code>web/.env</code> 中的 Web 登录账号和密码。与 GDD 行情账号分开管理。</p>
  <form id="login">
    <label for="username">用户名</label>
    <input id="username" name="username" type="text" value="admin" autocomplete="username" required maxlength="60"/>
    <label for="password">登录密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" autofocus/>
    <button id="submit" type="submit">安全登录</button>
    <div class="err" id="error" role="alert"></div>
  </form>
  <footer>仅授权用户访问 · 会话有效期12小时</footer>
</main>
<script>
const form=document.getElementById('login'),button=document.getElementById('submit'),error=document.getElementById('error');
form.addEventListener('submit',async e=>{
 e.preventDefault();button.disabled=true;button.textContent='正在验证…';error.textContent='';
 try{
  const response=await fetch('/api/v1/web-auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'登录失败');
  location.replace('/');
 }catch(e){error.textContent=e.message||'网络错误';}
 finally{button.disabled=false;button.textContent='安全登录';}
});
</script>
</body></html>
