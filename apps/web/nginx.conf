server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 选股接口转发给 stock-select。
    # 这个 location 比 /api/ 更长，Nginx 会优先匹配。
    location /api/v1/select/ {
        proxy_pass http://stock-select:8090/api/v1/select/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余行情接口由 market-data 提供。
    location /api/ {
        proxy_pass http://market-data:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://market-data:8080/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
