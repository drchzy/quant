server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 默认保护整个 Web 与反向代理 API。
    # 账号密码由容器启动脚本根据 WEB_USERNAME / WEB_PASSWORD 生成。
    auth_basic "Quant";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 盘中执行与持仓接口。
    location /api/v1/trading/ {
        proxy_pass http://trade-manager:8091/api/v1/trading/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 选股、复盘和回测接口。
    location /api/v1/select/ {
        proxy_pass http://stock-select:8090/api/v1/select/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余行情接口由 market-data 提供。
    location /api/ {
        proxy_pass http://market-data:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://market-data:8080/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
