# Login rate limit (shared by all web users).
limit_req_zone $binary_remote_addr zone=quant_login:10m rate=8r/m;

server {
    listen 8088;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # auth_request protects static files, market APIs, trading, sync and bridge endpoints.
    # Only the login UI/login API, isolated MCP Bearer auth, and health checks are exempt.
    location = /_quant_auth {
        internal;
        proxy_pass http://127.0.0.1:8080/api/v1/web-auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }

    location = /login.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /api/v1/web-auth/login {
        limit_req zone=quant_login burst=6 nodelay;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8080/api/v1/web-auth/login;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Host $host;
    }

    location = /api/v1/web-auth/logout {
        auth_request /_quant_auth;
        proxy_pass http://127.0.0.1:8080/api/v1/web-auth/logout;
    }

    # MCP keeps its own independent Bearer token, not the website session cookie.
    location = /mcp {
        proxy_pass http://127.0.0.1:8080/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    location /api/v1/trading/ {
        auth_request /_quant_auth;
        proxy_pass http://127.0.0.1:8091/api/v1/trading/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/select/ {
        auth_request /_quant_auth;
        proxy_pass http://127.0.0.1:8090/api/v1/select/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        auth_request /_quant_auth;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /_quant_auth;
        error_page 401 = @login_redirect;
        try_files $uri /index.html;
    }

    location @login_redirect {
        return 302 /login.html;
    }
}
